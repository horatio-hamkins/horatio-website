heading: Miscellanea
blurb: |
  My favorite books that I've read each year: <br>
  2022 - A Fraction of the Whole, The Ocean at the End of the Lane <br>
  2023 - The Overstory <br>
  2024 - All the Light We Cannot See <br>
  2025 - Consider Phlebas, Subways are for Sleeping <br>
  2026 - Gates of Fire, or Never Cry Wolf (for now!) <br>

  Other books I have read are cataloged on my <a href="https://www.goodreads.com/user/show/94010130?ref=nav_profile_l" target="_blank">goodreads</a>.

  My favorite board game is Twilight Imperium. I also enjoy Coimbra, Terraforming Mars, Dominion, and Magic the Gathering.

  I have an <a href="https://en.wikipedia.org/wiki/Erd%C5%91s_number" target="_blank">Erdős Number</a> of 5.