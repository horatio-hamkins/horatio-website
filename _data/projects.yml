heading: Projects
#blurb: A selection of engineering and software projects.

# To add a thumbnail to the left of an item, drop the image file in images/
# and add an "image" line to the item, e.g.:  image: images/robot.jpg

items:
  - title: "Makerspace - 2023 to 2026"
    image: images/makerspace.png
    video_hover: images/makerspace-hover.mp4
    description: >
      I founded the University of Bath Makerspace and an accompanying robot fighting competition with funding from Research Culture England, University of Bath Alumni Association, SETsquared Bath Innovation Center, Center For Excellence In Engineering & Design Education, The Student Union, and the Department of Mechanical Engineering. 
    links:
      - label: website
        url: https://www.thesubath.com/makerspace/
      - label: instagram
        url: https://www.instagram.com/bathmakerspace

  - title: "Wire Bending Machine for Real-Time Portable Art Fabrication - 2026"
    image: images/wirebending.png
    video_hover: images/wirebending-hover.mp4
    description: >
      In creating this machine, I demonstrated ephemeral fabrication, characterized stick-slip friction as a mechanism for wirebending, and created a surface-adaptive spiral wrapping algorithm.
    links:
      - label: project page
        url: /assets/files/FYP_final_presentation.pdf

  - title: "Resin Formulation for 3D Printed Microfluidic Devices - in progress"
    image: images/microfluidics.png
    video_hover: images/microfluidics-hover.mp4
    description: >
      The democratization of microfluidic technology requires machines capable of rapid fabrication of microfluidic devices. My current research in materials science aims to develop a type of resin that is conductive to this goal.

  - title: "Mobile Computing With Generative User Interfaces on E-Ink Devices - in progress"
    video: images/einkvideo.mp4
    description: > 
      AI agents with superhuman computer-use capabilities are here. In this project, I develop a device to help imagine a future where
      human users interact with AI agents through portable e-ink devices to perform their job.
      The experience feels like writing in a journal, or sketching in a notebook, but with intelligence embedded in the page.
      Developed with financial support from the Arthur Clements Fund. 
      
  - title: "Portrait Drawing Robot - 2025"
    image: images/portraitdrawimage.png
    video: images/portrait-robot-hover.mp4
    description: >
      I created an autonomous drawing robot by developing a software pipeline that
      converts photos into G-code for a modified 3D printer, and used it to draw 100+
      portraits at the University of Bath Groups Fair.
    links:
      - label: code
        url: https://github.com/horatio-hamkins/Portrait-Outliner
  
  - title: "AI-Marker: A Multi-Agent System for Marking Business Coursework - 2025"
    video: images/ai-marker-demo.mp4
    description: >
      As part of a Business for Engineering class, designed a workflow
      incorporating nine separate AI agents to facilitate the autonomous marking
      of university coursework.
    links:
      - label: project page
        url: /assets/files/ai_marker_buisness_report.pdf
  
 